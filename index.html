<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HalCeKey - Home</title>
  <link rel="icon" type="image/svg+xml" href="https://halcekey.github.io/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Outline&display=swap" rel="stylesheet">

  <style>
    body.theme-night {
      --bg: #060913;
      --text-color: #ecf0f1;
      --nav-color: #5a6075;
      --hover-color: #ddccff;
      --hover-shadow: 
        0 0 2px #ffffff,
        0 0 8px rgba(255, 255, 255, 0.9),
        0 0 16px #ff0055,
        0 0 32px #ff0055,
        0 0 64px #00f0ff;
      --underline-color: transparent;
    }

    body.theme-morning {
      --bg: linear-gradient(135deg, #dfb0ff 30%, #ede8f5 80%, #ffffff 100%);
      --text-color: #38324a;
      --nav-color: #544b6e;
      --hover-color: #2b2342;
      --hover-shadow: none;
      --underline-color: #7b68ee;
    }

    body.theme-day {
      --bg: #f4f5f7;
      --text-color: #1a1a24;
      --nav-color: #3b3e4d;
      --hover-color: #000000;
      --hover-shadow: none;
      --underline-color: #1a1a24;
    }

    body.theme-sunset {
      --bg: linear-gradient(135deg, #1b204a 0%, #4a284e 40%, #c44f3b 80%, #f0833a 100%);
      --text-color: #fcefe3;
      --nav-color: #e8caa4;
      --hover-color: #ffffff;
      --hover-shadow: 
        0 0 2px #ffffff,
        0 0 10px #ffcc77,
        0 0 25px #ff5e36,
        0 0 50px #ff2a5f;
      --underline-color: transparent;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      transition: background 0.6s ease, color 0.4s ease;
      overflow-x: hidden;
    }

    header {
      padding: 3rem 1rem 1rem;
      text-align: center;
      z-index: 1;
    }

    .site-title {
      font-size: 1.1rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    main {
      z-index: 1;
      margin: auto 0;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      list-style: none;
      text-align: center;
    }

    .nav-link {
      font-family: "Bungee Outline", cursive;
      font-size: clamp(2.5rem, 6vw, 3.75rem);
      letter-spacing: 0.12em;
      text-decoration: none;
      color: var(--nav-color);
      position: relative;
      padding: 0.25rem 1rem;
      display: inline-block;
      transition: color 0.25s ease, text-shadow 0.25s ease, transform 0.2s ease;
    }

    .nav-link:hover {
      color: var(--hover-color);
      text-shadow: var(--hover-shadow);
      transform: scale(1.02);
    }
      
    .nav-link::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 10%;
      width: 80%;
      height: 2px;
      background-color: var(--underline-color);
      transform: scaleX(0);
      transition: transform 0.25s ease;
    }

    .nav-link:hover::after {
      transform: scaleX(1);
    }

    footer {
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      z-index: 1;
    }

    .time-status {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.65;
    }
  </style>
</head>
<body>

  <header>
    <div class="site-title">HALCEKEY</div>
  </header>

  <main>
    <nav>
      <ul class="nav-list">
        <li><a href="#about" class="nav-link">About</a></li>
        <li><a href="https://halcekey.github.io/yomimono" class="nav-link">Work</a></li>
        <li><a href="#contact" class="nav-link">Contact</a></li>
      </ul>
    </nav>
  </main>

  <footer>
    <div class="time-status" id="time-status">FETCHING TIME...</div>
  </footer>

  <script>
    function applyTimeTheme() {
      const now = new Date();
      const hour = now.getHours();
      const statusElement = document.getElementById('time-status');

      document.body.classList.remove('theme-morning', 'theme-day', 'theme-sunset', 'theme-night');

      let themeClass = '';
      let label = '';

      if (hour >= 6 && hour < 9) {
        themeClass = 'theme-morning';
        label = 'MORNING';
      } else if (hour >= 9 && hour < 16) {
        themeClass = 'theme-day';
        label = 'DAY';
      } else if (hour >= 16 && hour < 19) {
        themeClass = 'theme-sunset';
        label = 'EVENING';
      } else {
        themeClass = 'theme-night';
        label = 'NIGHT';
      }

      document.body.classList.add(themeClass);
      if (statusElement) {
        statusElement.textContent = label;
      }
    }
    applyTimeTheme();
    setInterval(applyTimeTheme, 600000);
  </script>
</body>
</html>
